<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex justify-center items-center h-screen">

<div class="bg-white shadow-lg rounded-xl p-8 w-full max-w-md">

    <h1 class="text-[1.5rem] font-bold text-center mb-6">Event Hall Reservation</h1>

    <form action="/login" method="POST" class="flex flex-col gap-4">

        <div>
            <label class="block mb-1 text-[1rem] font-bold">Username</label>
            <input type="username" name="username"
                   class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                   required>
        </div>

        <div>
            <label class="block mb-1 text-[1rem] font-bold">Password</label>
            <input type="password" name="password"
                   class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                   required>
        </div>

        <button type="submit"
                class="w-full bg-blue-600 text-white py-2 mt-2 rounded-lg hover:bg-blue-700 transition">
            Login
        </button>

    </form>

</div>

</body>
</html>
